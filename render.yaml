services:
  - type: web
    name: nigerian-tax-api
    env: python
    buildCommand: pip install -r requirements-main.txt && pip install -r requirements-additional.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BACKEND_CORS_ORIGINS
        value: "https://nigerian-tax-compliance.onrender.com,http://localhost:3000,http://localhost:3001"
```

