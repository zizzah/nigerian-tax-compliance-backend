# pytest.ini
# Location: tests/pytest.ini or root pytest.ini

[pytest]
# Asyncio configuration (fixes the warning you saw)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers (for organizing tests)
markers =
    security: Security-related tests
    rate_limit: Rate limiting tests
    sanitization: Input sanitization tests
    headers: Security headers tests
    integration: Integration tests
    slow: Slow running tests